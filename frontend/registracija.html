{% load static %}
<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Registracija</title>
  <link rel="stylesheet" href="{% static 'css/registracija.css' %}">
  <script src="{% static 'js/registracija.js' %}"></script>
</head>
<body>
  <header class="hdr">
    <div class="logo">Žemės Ūkio IS</div>
    <nav>
      <a href="/pagrindinis/">Pagrindinis</a>
      <a href="/prisijungimas/">Prisijungimas</a>
    </nav>
  </header>

  <main class="wrap">
    <h1>Registracija</h1>

    <!-- FORM REALIAI SIUNČIA Į DJANGO -->
    <form class="reg-form" method="POST" action="/registracija/">
      {% csrf_token %}

      <label>Vardas *</label>
      <input type="text" name="Vardas" placeholder="Įveskite vardą" required>

      <label>Pavardė *</label>
      <input type="text" name="Pavarde" placeholder="Įveskite pavardę" required>

      <label>El. paštas *</label>
      <input type="email" name="El_pastas" placeholder="example@gmail.com" required>

      <label>Slaptažodis *</label>
      <input type="password" name="Slaptazodis" placeholder="Slaptažodis..." required>

      <label>Paskyros tipas *</label>
      <select name="Pareigos" required>
        <option value="1">Klientas</option>
        <option value="2">Darbuotojas</option>
      </select>

      <label>Sąskaitos numeris (IBAN) *</label>
      <input type="text" name="Saskaitos_numeris" placeholder="LT00 0000 0000 0000 0000" required>

      <div class="actions">
        <button type="submit" class="confirm">Registruotis</button>
        <button type="button" class="cancel" onclick="window.location.href='/pagrindinis/'">Atšaukti</button>
      </div>

      {% if error %}
        <p style="color:red; margin-top:10px;">{{ error }}</p>
      {% endif %}
    </form>
  </main>

  <footer class="ftr">© 2025 Žemės Ūkio IS</footer>
</body>
</html>
