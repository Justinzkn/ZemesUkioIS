{% load static %}
<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Redaguoti įrangą</title>
    <link rel="stylesheet" href="{% static 'css/iranga_redaguoti.css' %}">
    <script src="{% static 'js/iranga_redaguoti.js' %}"></script>
</head>

<body>

<header>
  <div class="logo">Žemės Ūkio IS</div>
  <nav>
    <a href="/iranga/">Atgal</a>
    <a href="/atsijungti/" style="color: red;">Atsijungti</a>
  </nav>
</header>

<h1>Redaguoti įrangą</h1>

<div class="form-container">
  <form method="POST">
    {% csrf_token %}

    <label>Pavadinimas *</label>
    <input type="text" name="Pavadinimas" value="{{ iranga.Pavadinimas }}" required>

    <label>Tipas *</label>
    <select name="Tipas" required>
      <option value="1" {% if iranga.Tipas == 1 %}selected{% endif %}>Traktorius</option>
      <option value="2" {% if iranga.Tipas == 2 %}selected{% endif %}>Priekaba</option>
      <option value="3" {% if iranga.Tipas == 3 %}selected{% endif %}>Sėjamoji</option>
      <option value="4" {% if iranga.Tipas == 4 %}selected{% endif %}>Kultivatorius</option>
      <option value="5" {% if iranga.Tipas == 5 %}selected{% endif %}>Purškimo įranga</option>
    </select>

    <label>Būklė *</label>
    <input type="text" name="Bukle" value="{{ iranga.Bukle }}" required>

    <label>Vieta *</label>
    <input type="text" name="Vieta" value="{{ iranga.Vieta }}" required>

    <label>Vertė (€) *</label>
    <input type="number" step="0.01" name="Verte" value="{{ iranga.Verte }}" required>

    <label>Gamintojas *</label>
    <input type="text" name="Gamintojas" value="{{ iranga.Gamintojas }}" required>

    <label>Pagaminimo data *</label>
    <input type="date" name="Pagaminimo_data" value="{{ iranga.Pagaminimo_data|date:'Y-m-d' }}" required>
    <label>Techninė apžiūra *</label>
    <input type="date" name="Technine_apziura" value="{{ iranga.Technine_apziura|date:'Y-m-d' }}" required>

    <div class="actions">
      <button class="save" type="submit">Išsaugoti</button>
      <button class="cancel" type="button" onclick="window.location.href='/iranga/'">Atšaukti</button>
    </div>
  </form>
</div>

<footer>
  © 2025 Žemės Ūkio IS
</footer>

</body>
</html>
