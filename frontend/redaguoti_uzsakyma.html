{% load static %}
<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Užsakymo redagavimas</title>
  <link rel="stylesheet" href="{% static 'css/redaguoti_uzsakyma.css' %}">
</head>
<body>
  <header class="hdr">
    <div class="logo">Žemės Ūkio IS</div>
    <nav class="nav">
      <a href="/pagrindinis/">Pagrindinis</a>
      <a href="/uzsakymai/">Užsakymai</a>
    </nav>
  </header>

  <main class="wrap">
    <h1>Užsakymo redagavimas</h1>

    <form class="edit-form" method="POST">
      {% csrf_token %}

      <div class="row">
        <label>Bendra kaina (€)</label>
        <input type="text" value="{{ uzsakymas.Kaina }}" readonly>
      </div>

      <h2>Prekės užsakyme</h2>

      <table class="items-table">
        <thead>
          <tr>
            <th>Prekė</th>
            <th>Kaina (€)</th>
            <th>Kiekis</th>
            <th>Pašalinti</th>
          </tr>
        </thead>
        <tbody>
          {% for p in uz_prekes %}
          <tr>
            <td>{{ p.Pavadinimas }}</td>
            <td>{{ p.Kaina }}</td>
            <td>
              <input type="hidden" name="up_id" value="{{ p.id_Uzsakymo_preke }}">
              <input type="number" name="kiekis" value="{{ p.Kiekis }}" min="1">
            </td>
            <td>
              <input type="checkbox" name="remove_ids" value="{{ p.id_Uzsakymo_preke }}">
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

      <h2>Pridėti naujas prekes</h2>

      <table class="items-table">
        <thead>
          <tr>
            <th>Prekė</th>
            <th>Kiekis</th>
          </tr>
        </thead>
        <tbody id="new-items-body">
          <tr>
            <td>
              <select name="new_preke">
                <option value="">-- Pasirinkite prekę --</option>
                {% for p in visos_prekes %}
                  <option value="{{ p.id_Preke }}">
                    {{ p.Pavadinimas }} ({{ p.Kaina }} €)
                  </option>
                {% endfor %}
              </select>
            </td>
            <td>
              <input type="number" name="new_kiekis" min="1">
            </td>
          </tr>
        </tbody>
      </table>

      <div class="actions">
        <!-- SVARBU: onclick="addNewRow()" -->
        <button type="button"
                class="save add-row-btn"
                onclick="addNewRow()">
          + Pridėti dar vieną prekę
        </button>
      </div>

      <div class="actions">
        <button type="submit" class="save">Išsaugoti pakeitimus</button>
        <button type="button" class="back" onclick="window.location.href='/uzsakymai/'">
          Grįžti
        </button>
      </div>
    </form> 
  </main>

  <footer class="ftr">© 2025 Žemės Ūkio IS</footer>

  <!-- JS užkrovimas apačioje + versijos parametras, kad nebūtų cache -->
  <script src="{% static 'js/redaguoti_uzsakyma.js' %}?v=3"></script>
</body>
</html>
