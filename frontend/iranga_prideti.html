{% load static %}
<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Pridėti įrangą</title>
  <link rel="stylesheet" href="{% static 'css/iranga_prideti.css' %}">
</head>

<body>

<header>
  <div class="logo">Žemės Ūkio IS</div>
  <nav>
      <a href="/pagrindinis/">Pagrindinis</a>
      <a href="/iranga/">Įrangos peržiūra</a>
      <a href="/atsijungti/" style="color:red;">Atsijungti</a>
  </nav>
</header>

<h1>Pridėti naują įrangą</h1>

<div class="form-container">

  <form method="POST" action="/iranga/prideti/">
      {% csrf_token %}

      <label>Pavadinimas *</label>
      <input type="text" name="Pavadinimas" required>

      <label>Tipas *</label>
      <select name="Tipas" required>
          <option value="">-- Pasirinkite tipą --</option>
          <option value="1">Traktorius</option>
          <option value="2">Priekaba</option>
          <option value="3">Sėjamoji</option>
          <option value="4">Kultivatorius</option>
          <option value="5">Purškimo įranga</option>
      </select>

      <label>Būklė *</label>
      <input type="text" name="Bukle" required>

      <label>Vieta *</label>
      <input type="text" name="Vieta" required>

      <label>Vertė (€) *</label>
      <input type="number" step="0.01" name="Verte" required>

      <label>Gamintojas *</label>
      <input type="text" name="Gamintojas" required>

      <label>Pagaminimo data *</label>
      <input type="date" name="Pagaminimo_data" required>

      <label>Techninė apžiūra *</label>
      <input type="date" name="Technine_apziura" required>

      <div class="actions">
        <button class="add" type="submit">Pridėti</button>
        <button type="button" class="back" onclick="window.location.href='/iranga/'">Atšaukti</button>
      </div>

  </form>

</div>

<footer>
  © 2025 Žemės Ūkio IS
</footer>

</body>
</html>
