{% load static %}
<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Šalinti įrangą</title>
    <link rel="stylesheet" href="{% static 'css/iranga_salinti.css' %}">
    <script src="{% static 'js/iranga_salinti.js' %}"></script>
</head>

<body>

<header>
    <div class="logo">Žemės Ūkio IS</div>
    <nav>
        <a href="/iranga/">Atgal</a>
        <a href="/atsijungti/" style="color:red;">Atsijungti</a>
    </nav>
</header>

<h1>Ar tikrai norite pašalinti šią įrangą?</h1>

<div class="warning-box">
    <p><strong>{{ iranga.Pavadinimas }}</strong></p>
    <p>Tipas: {{ iranga.Tipas }}</p>
    <p>Būklė: {{ iranga.Bukle }}</p>
</div>

<form method="POST" action="/iranga/salinti/?id={{ iranga.id_iranga }}">
    {% csrf_token %}
    
    <button type="submit" class="confirm" style="background:red;">Šalinti</button>
    <button type="button" class="cancel" onclick="window.location.href='/iranga/'">Atšaukti</button>
</form>

<footer>
    © 2025 Žemės Ūkio IS
</footer>

</body>
</html>
