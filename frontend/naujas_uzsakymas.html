{% load static %}
<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Naujas užsakymas</title>
  <link rel="stylesheet" href="{% static 'css/naujas_uzsakymas.css' %}">
  <script src="{% static 'js/naujas_uzsakymas.js' %}"></script>
</head>
<body>
<header>
    <div class="logo">Žemės Ūkio IS</div>
    <nav>
      <a href="/pagrindinis/">Pagrindinis</a>
      <a href="/uzsakymai/">Užsakymai</a>
    </nav>
</header>
    {% if msg %}
    <div class="alert alert-error">{{ msg }}</div>
    {% endif %}
<h1>Naujas užsakymas</h1>

<form method="POST">
    {% csrf_token %}

    <h3>Prekės:</h3>

    <div id="prekiu-laukas">

        <!-- Vienos prekės blokas -->
        <div class="preke-box">

            <label>Prekė:</label>
            <select name="preke" required>
                <option value="">-- Pasirinkite prekę --</option>
                {% for p in prekes %}
                <option value="{{ p.id_Preke }}">{{ p.Pavadinimas }} ({{ p.Kaina }} €)</option>
                {% endfor %}
            </select>

            <label>Kiekis:</label>
            <input type="number" name="kiekis" min="1" required>

            <!-- ⚠️ Mygtukas prekei pašalinti -->
            <button type="button" class="remove-btn" onclick="removeItem(this)">Pašalinti</button>

        </div>

    </div>

    <button type="button" onclick="addItem()" class="add-btn">+ Pridėti prekę</button>

    <br><br>
    <button type="submit" class="submit-btn">Sukurti užsakymą</button>

</form>

<!-- JS funkcijos -->
<script>
function addItem() {
    const container = document.getElementById("prekiu-laukas");
    const box = document.querySelector(".preke-box").cloneNode(true);

    // išvalom reikšmes
    box.querySelector("select").value = "";
    box.querySelector("input").value = "";

    container.appendChild(box);
}

function removeItem(button) {
    const box = button.parentElement;

    // neleisti panaikinti paskutinės prekės
    const all = document.querySelectorAll(".preke-box");
    if (all.length === 1) {
        alert("Negalite pašalinti vienintelės prekės — turi būti bent viena.");
        return;
    }

    box.remove();
}
</script>

<footer>
    © 2025 Žemės Ūkio IS
</footer>

</body>
</html>
