{% load static %}
<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Prisijungimas</title>
  <link rel="stylesheet" href="{% static 'css/prisijungimas.css' %}">
  <script src="{% static 'js/prisijungimas.js' %}"></script>
</head>
<body>
  <header class="hdr">
    <div class="logo">Žemės Ūkio IS</div>
    <nav>
      <a href="/pagrindinis/">Pagrindinis</a>
      <a href="/registracija/">Registracija</a>
    </nav>
  </header>

  <main class="wrap">
    <h1>Prisijungimas</h1>

    <!-- FORM REALIAI SIUNČIA Į DJANGO -->
    <form class="login-form" method="POST" action="/prisijungimas/">
      {% csrf_token %}

      <label>El. paštas *</label>
      <input type="email" name="El_pastas" placeholder="example@gmail.com" required>

      <label>Slaptažodis *</label>
      <input type="password" name="Slaptazodis" placeholder="Slaptažodis..." required>

      <div class="actions">
        <button type="submit" class="login">Prisijungti</button>
        <button type="button" class="back" onclick="window.location.href='/pagrindinis/'">Grįžti</button>
      </div>

      {% if error %}
        <p style="color:red; margin-top:10px;">{{ error }}</p>
      {% endif %}
    </form>
  </main>

  <footer class="ftr">© 2025 Žemės Ūkio IS</footer>
</body>
</html>
